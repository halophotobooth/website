<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" width="600" height="480">
<defs>
<radialGradient id="bg" cx="50%" cy="30%" r="80%"><stop offset="0" stop-color="#3a2814"/><stop offset="1" stop-color="#1b130d"/></radialGradient>
<linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8cf8a"/><stop offset=".55" stop-color="#c9a24a"/><stop offset="1" stop-color="#a37d2c"/></linearGradient>
<linearGradient id="body" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f7efdf"/><stop offset=".6" stop-color="#fbf6ea"/><stop offset="1" stop-color="#d9caa8"/></linearGradient>
<pattern id="seq" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r="5" fill="#c9a24a" opacity=".55"/><circle cx="5" cy="5" r="1.6" fill="#f3e2a8" opacity=".8"/></pattern>
</defs>
<rect width="600" height="480" fill="url(#bg)"/>
<!-- sequin backdrop -->
<rect x="300" y="40" width="250" height="360" fill="url(#seq)"/>
<rect x="300" y="40" width="250" height="360" fill="none" stroke="#c9a24a" stroke-width="2"/>
<line x1="300" y1="40" x2="300" y2="430" stroke="#5a4636" stroke-width="5"/><line x1="550" y1="40" x2="550" y2="430" stroke="#5a4636" stroke-width="5"/>
<!-- floor -->
<ellipse cx="300" cy="440" rx="270" ry="22" fill="#000" opacity=".35"/>
<!-- tripod -->
<g stroke="#2a1d14" stroke-width="6" stroke-linecap="round"><line x1="170" y1="300" x2="120" y2="440"/><line x1="170" y1="300" x2="220" y2="440"/><line x1="170" y1="300" x2="170" y2="445"/></g>
<rect x="160" y="270" width="20" height="40" fill="#2a1d14"/>
<!-- booth head -->
<rect x="90" y="110" width="160" height="165" rx="14" fill="url(#body)" stroke="url(#gold)" stroke-width="5"/>
<circle cx="170" cy="172" r="46" fill="none" stroke="#fff8e0" stroke-width="10" opacity=".95"/>
<circle cx="170" cy="172" r="46" fill="none" stroke="#e8cf8a" stroke-width="2"/>
<circle cx="170" cy="172" r="26" fill="#1b130d"/><circle cx="170" cy="172" r="15" fill="#2c3a4a"/><circle cx="164" cy="166" r="5" fill="#9fb4c8"/>
<rect x="120" y="230" width="100" height="32" rx="4" fill="#1b130d"/>
<text x="170" y="252" text-anchor="middle" font-family="Georgia,serif" font-size="15" fill="#e8cf8a">tap to start</text>
<ellipse cx="170" cy="100" rx="40" ry="8" fill="none" stroke="#e8cf8a" stroke-width="3"/>
<!-- printer -->
<rect x="225" y="360" width="80" height="60" rx="6" fill="#2a1d14" stroke="#c9a24a" stroke-width="2"/>
<rect x="245" y="330" width="40" height="40" fill="#fbf6ea"/>
<!-- light -->
<line x1="560" y1="120" x2="560" y2="440" stroke="#2a1d14" stroke-width="5"/>
<rect x="535" y="80" width="50" height="60" rx="6" fill="#fff8e0" opacity=".9"/>
<path d="M535 110 L420 200 L420 260 L535 140 Z" fill="#fff8e0" opacity=".08"/>
<!-- props -->
<g transform="rotate(-14 400 400)"><rect x="370" y="385" width="70" height="26" rx="4" fill="#fbf6ea" stroke="#c9a24a" stroke-width="2"/><text x="405" y="403" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#2a1d14">Cheers!</text></g>
<path d="M455 420 l10 -28 l10 28 Z" fill="#c9a24a"/>
</svg>
